<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1><a href="#" style="color: white;">Admin Portal</a></h1>
            <div class="user-info">
                <span id="userName">Loading...</span>
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="nav-links">
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="users.html">Manage Users</a></li>
                <li><a href="products.html">All Products</a></li>
                <li><a href="orders.html">All Orders</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2>Welcome, <span id="welcomeName">Admin</span></h2>
            
            <div class="cards-grid">
                <div class="stat-card">
                    <h4>Total Users</h4>
                    <div class="value" id="statUsers">0</div>
                </div>
                <div class="stat-card">
                    <h4>Farmers</h4>
                    <div class="value" id="statFarmers">0</div>
                </div>
                <div class="stat-card">
                    <h4>Customers</h4>
                    <div class="value" id="statCustomers">0</div>
                </div>
                <div class="stat-card">
                    <h4>Drivers</h4>
                    <div class="value" id="statDrivers">0</div>
                </div>
                <div class="stat-card">
                    <h4>Wholesalers</h4>
                    <div class="value" id="statWholesalers">0</div>
                </div>
                <div class="stat-card">
                    <h4>Total Products</h4>
                    <div class="value" id="statProducts">0</div>
                </div>
                <div class="stat-card">
                    <h4>Total Orders</h4>
                    <div class="value" id="statOrders">0</div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { checkRoleAccess, logoutUser, getCurrentUserData } from '../js/auth.js';
        import { initAdminDashboard } from '../js/admin.js';
        
        checkRoleAccess('admin');
        
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        
        getCurrentUserData((user) => {
            if(user) {
                document.getElementById('userName').textContent = user.name;
                document.getElementById('welcomeName').textContent = user.name;
                initAdminDashboard(user);
            }
        });
    </script>
</body>
</html>
