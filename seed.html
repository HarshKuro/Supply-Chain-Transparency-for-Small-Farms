<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Demo Database | AgriTrace</title>
    <link rel="stylesheet" href="css/style.css?v=3">
    <style>
        body { 
            background: #f8fafc;
            padding: 2.5rem 1rem;
        }
        .seed-card {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border-color);
        }
        .log-entry { margin-bottom: 0.5rem; }
        .success { color: #10b981; font-weight: 600; }
        .error { color: #f59e0b; }
    </style>
</head>
<body>
    <header id="app-navbar" class="app-navbar" style="margin-bottom: 2rem;"></header>
    <div class="seed-card">
        <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem;">
            <div class="brand-icon">🌱</div>
            <h2 style="font-size: 1.75rem; margin-bottom: 0;">AgriTrace Database Seeder</h2>
        </div>
        <p style="color: #64748b; margin-bottom: 1.5rem;">
            Generating demo accounts and realistic organic produce items in your Firebase Firestore cluster.
        </p>

        <div id="log" style="background: #0f172a; color: #cbd5e1; padding: 1.5rem; border-radius: var(--radius-md); height: 350px; overflow-y: scroll; font-family: monospace; font-size: 0.88rem; line-height: 1.6; border: 1px solid #1e293b;"></div>
        
        <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: space-between; align-items: center; flex-wrap: wrap;">
            <a href="index.html" class="btn btn-secondary">← Back to Home</a>
            <div style="display: flex; gap: 0.75rem;">
                <a href="login.html" class="btn">Proceed to Login →</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initNavbar } from './js/navbar.js';
        initNavbar({ role: 'seed' });

        import { app, auth, db } from './js/firebase-config.js';
        import { createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { collection, doc, setDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const logDiv = document.getElementById('log');
        const log = (msg, type = '') => {
            logDiv.innerHTML += `<div class="log-entry ${type}">${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        };

        const users = [
            { email: 'farmer@example.com', name: 'Ramesh (Farmer)', role: 'farmer', phone: '9876543210' },
            { email: 'wholesaler@example.com', name: 'Suresh (Wholesaler)', role: 'wholesaler', phone: '9876543211' },
            { email: 'driver@example.com', name: 'Raju (Driver)', role: 'driver', phone: '9876543212' },
            { email: 'customer@example.com', name: 'Amit (Customer)', role: 'customer', phone: '9876543213' },
            { email: 'admin@example.com', name: 'System Admin', role: 'admin', phone: '9876543214' }
        ];

        const products = [
            { name: 'Tomato', category: 'Vegetables', description: 'Fresh farm tomatoes', price: 40, quantity: 100, unit: 'kg' },
            { name: 'Potato', category: 'Vegetables', description: 'Fresh organic potatoes', price: 30, quantity: 200, unit: 'kg' },
            { name: 'Onion', category: 'Vegetables', description: 'Red onions', price: 50, quantity: 150, unit: 'kg' },
            { name: 'Carrot', category: 'Vegetables', description: 'Fresh carrots', price: 60, quantity: 80, unit: 'kg' },
            { name: 'Spinach', category: 'Vegetables', description: 'Green spinach', price: 20, quantity: 50, unit: 'kg' },
            { name: 'Apple', category: 'Fruits', description: 'Fresh sweet apples', price: 120, quantity: 100, unit: 'kg' },
            { name: 'Wheat', category: 'Grains', description: 'High quality wheat', price: 25, quantity: 500, unit: 'kg' },
            { name: 'Rice', category: 'Grains', description: 'Basmati rice', price: 60, quantity: 400, unit: 'kg' }
        ];

        async function seed() {
            let farmerId = null;

            log('--- Starting User Creation ---');
            for (const u of users) {
                try {
                    log(`Attempting to create: ${u.email}`);
                    const cred = await createUserWithEmailAndPassword(auth, u.email, 'password123');
                    await setDoc(doc(db, "users", cred.user.uid), {
                        name: u.name,
                        email: u.email,
                        phone: u.phone,
                        role: u.role,
                        createdAt: serverTimestamp()
                    });
                    log(`Success: Created ${u.role} account.`, 'success');
                    
                    if (u.role === 'farmer') {
                        farmerId = cred.user.uid;
                    }
                } catch (e) {
                    if (e.code === 'auth/email-already-in-use') {
                        log(`Notice: ${u.email} already exists. Fetching account...`, 'error');
                        try {
                            const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js");
                            const cred = await signInWithEmailAndPassword(auth, u.email, 'password123');
                            if (u.role === 'farmer') farmerId = cred.user.uid;
                            log(`Successfully retrieved ID for ${u.email}.`, 'success');
                        } catch (err) {
                            log(`Could not log in to existing account: ${err.message}`, 'error');
                        }
                    } else {
                        log(`Error creating ${u.email}: ${e.message}`, 'error');
                    }
                }
            }

            log('<br>--- Starting Product Creation ---');
            if (farmerId) {
                for (const p of products) {
                    try {
                        await addDoc(collection(db, "products"), {
                            ...p,
                            available: true,
                            farmerId: farmerId,
                            farmerName: 'Ramesh (Farmer)',
                            createdAt: serverTimestamp()
                        });
                        log(`Success: Added product ${p.name}`, 'success');
                    } catch (e) {
                        log(`Error adding ${p.name}: ${e.message}`, 'error');
                    }
                }
            } else {
                log('Notice: Could not find farmer ID to attach products to.', 'error');
            }

            try {
                await signOut(auth);
            } catch (e) {}
            
            log('<br><b>--- SEEDING COMPLETE ---</b>', 'success');
            log('<b>All demo accounts password: <code>password123</code></b>');
        }

        seed();
    </script>
</body>
</html>
