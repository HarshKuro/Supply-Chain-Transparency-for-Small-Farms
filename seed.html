<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seed Database</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; line-height: 1.6; }
        .log-entry { margin-bottom: 0.5rem; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>Seeding Database... Please wait.</h2>
    <p>This script will create demo accounts and some sample products.</p>
    <div id="log" style="background: #f5f5f5; padding: 1rem; border-radius: 5px; height: 300px; overflow-y: scroll; font-family: monospace;"></div>
    
    <div style="margin-top: 1rem;">
        <a href="index.html" style="padding: 10px 15px; background: #2E7D32; color: white; text-decoration: none; border-radius: 4px; display: inline-block;">Go to Home</a>
    </div>

    <script type="module">
        import { app, auth, db } from './js/firebase-config.js';
        import { createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { collection, doc, setDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const logDiv = document.getElementById('log');
        const log = (msg, type = '') => {
            logDiv.innerHTML += `<div class="log-entry ${type}">${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        };

        const users = [
            { email: 'farmer@example.com', name: 'Jack Miller (Farmer)', role: 'farmer', phone: '0412345671' },
            { email: 'wholesaler@example.com', name: 'Liam Wilson (Wholesaler)', role: 'wholesaler', phone: '0412345672' },
            { email: 'driver@example.com', name: 'Lucas Brown (Driver)', role: 'driver', phone: '0412345673' },
            { email: 'customer@example.com', name: 'Chloe Taylor (Customer)', role: 'customer', phone: '0412345674' },
            { email: 'admin@example.com', name: 'System Admin', role: 'admin', phone: '0412345675' }
        ];

        const products = [
            { name: 'Tomato', category: 'Vegetables', description: 'Fresh farm tomatoes', price: 4.50, quantity: 100, unit: 'kg' },
            { name: 'Potato', category: 'Vegetables', description: 'Fresh organic potatoes', price: 3.00, quantity: 200, unit: 'kg' },
            { name: 'Onion', category: 'Vegetables', description: 'Red onions', price: 2.80, quantity: 150, unit: 'kg' },
            { name: 'Carrot', category: 'Vegetables', description: 'Fresh carrots', price: 2.50, quantity: 80, unit: 'kg' },
            { name: 'Spinach', category: 'Vegetables', description: 'Green spinach', price: 3.50, quantity: 50, unit: 'kg' },
            { name: 'Apple', category: 'Fruits', description: 'Fresh sweet apples', price: 5.00, quantity: 100, unit: 'kg' },
            { name: 'Wheat', category: 'Grains', description: 'High quality wheat', price: 1.50, quantity: 500, unit: 'kg' },
            { name: 'Rice', category: 'Grains', description: 'Australian grown rice', price: 3.20, quantity: 400, unit: 'kg' }
        ];

        async function seed() {
            let farmerId = null;

            log('--- Starting User Creation ---');
            for (const u of users) {
                try {
                    log(`Attempting to create: ${u.email}`);
                    const cred = await createUserWithEmailAndPassword(auth, u.email, 'password123');
                    await setDoc(doc(db, "users", cred.user.uid), {
                        name: u.name,
                        email: u.email,
                        phone: u.phone,
                        role: u.role,
                        createdAt: serverTimestamp()
                    });
                    log(`Success: Created ${u.role} account.`, 'success');
                    
                    if (u.role === 'farmer') {
                        farmerId = cred.user.uid;
                    }
                } catch (e) {
                    if (e.code === 'auth/email-already-in-use') {
                        log(`Notice: ${u.email} already exists. Updating profile...`, 'error');
                        try {
                            const { signInWithEmailAndPassword } = await import("https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js");
                            const cred = await signInWithEmailAndPassword(auth, u.email, 'password123');
                            await setDoc(doc(db, "users", cred.user.uid), {
                                name: u.name,
                                email: u.email,
                                phone: u.phone,
                                role: u.role
                            }, { merge: true });
                            if (u.role === 'farmer') farmerId = cred.user.uid;
                            log(`Successfully updated profile name to ${u.name} for ${u.email}.`, 'success');
                        } catch (err) {
                            log(`Could not update profile for existing account: ${err.message}`, 'error');
                        }
                    } else {
                        log(`Error creating ${u.email}: ${e.message}`, 'error');
                    }
                }
            }

            log('<br>--- Starting Product Creation ---');
            if (farmerId) {
                for (const p of products) {
                    try {
                        await addDoc(collection(db, "products"), {
                            ...p,
                            available: true,
                            farmerId: farmerId,
                            farmerName: 'Jack Miller (Farmer)',
                            createdAt: serverTimestamp()
                        });
                        log(`Success: Added product ${p.name} ($${p.price.toFixed(2)} AUD)`, 'success');
                    } catch (e) {
                        log(`Error adding ${p.name}: ${e.message}`, 'error');
                    }
                }
            } else {
                log('Notice: Could not find farmer ID to attach products to.', 'error');
            }

            try {
                await signOut(auth);
            } catch (e) {}
            
            log('<br><b>--- SEEDING COMPLETE ---</b>', 'success');
            log('<b>All accounts have the password: <code>password123</code></b>');
        }

        // Start seeding automatically
        seed();
    </script>
</body>
</html>
