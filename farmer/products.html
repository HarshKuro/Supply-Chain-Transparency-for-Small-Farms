<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Products - Farmer | Supply Chain Transparency</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>
                <a href="#" style="color: white;">
                    <i data-lucide="sprout"></i>
                    <span>Farmer Portal</span>
                </a>
            </h1>
            <div class="user-info">
                <span id="userName">Loading...</span>
                <button id="logoutBtn" class="btn btn-secondary">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h3>Farmer Menu</h3>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
                <li><a href="products.html" class="active"><i data-lucide="package"></i> My Products</a></li>
                <li><a href="orders.html"><i data-lucide="shopping-bag"></i> Orders</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;">
                <h2>My Products</h2>
                <button id="openAddProductModal" class="btn">
                    <i data-lucide="plus-circle"></i>
                    <span>Add Product</span>
                </button>
            </div>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productsTableBody">
                        <tr><td colspan="6" style="text-align:center;">Loading products...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Product</h3>
                <span class="close-modal" id="closeProductModal">&times;</span>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label for="productName">Product Name</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" placeholder="Vegetables, Fruits, Grains..." required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="3" required></textarea>
                </div>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 120px;">
                        <label for="price">Price ($ AUD)</label>
                        <input type="number" id="price" min="0" step="0.01" required>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 120px;">
                        <label for="quantity">Quantity</label>
                        <input type="number" id="quantity" min="0" required>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 120px;">
                        <label for="unit">Unit</label>
                        <input type="text" id="unit" placeholder="kg, box, etc." required>
                    </div>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="available" style="width: auto;">
                        <span>Available for Sale</span>
                    </label>
                </div>
                <button type="submit" class="btn" style="width: 100%;">
                    <i data-lucide="save"></i>
                    <span>Save Product</span>
                </button>
            </form>
        </div>
    </div>

    <script src="../js/lucide.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
    <script type="module">
        import { checkRoleAccess, logoutUser, getCurrentUserData } from '../js/auth.js';
        import { initProductsPage } from '../js/farmer.js';
        
        checkRoleAccess('farmer');
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        
        getCurrentUserData((user) => {
            if(user) {
                document.getElementById('userName').textContent = user.name;
                initProductsPage(user);
                if (window.lucide) lucide.createIcons();
            }
        });
    </script>
</body>
</html>
