<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbound Orders - Farmer | Supply Chain Transparency</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>
                <a href="#" style="color: white;">
                    <i data-lucide="sprout"></i>
                    <span>Farmer Portal</span>
                </a>
            </h1>
            <div class="user-info">
                <span id="userName">Loading...</span>
                <button id="logoutBtn" class="btn btn-secondary">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h3>Farmer Menu</h3>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
                <li><a href="products.html"><i data-lucide="package"></i> My Products</a></li>
                <li><a href="orders.html" class="active"><i data-lucide="shopping-bag"></i> Orders</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2>Customer Orders</h2>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Products</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Date</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <tr><td colspan="7" style="text-align:center;">Loading orders...</td></tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="../js/lucide.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
    <script type="module">
        import { checkRoleAccess, logoutUser, getCurrentUserData } from '../js/auth.js';
        import { initFarmerOrdersPage } from '../js/farmer.js';
        
        checkRoleAccess('farmer');
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        
        getCurrentUserData((user) => {
            if(user) {
                document.getElementById('userName').textContent = user.name;
                initFarmerOrdersPage(user);
                if (window.lucide) lucide.createIcons();
            }
        });
    </script>
</body>
</html>
