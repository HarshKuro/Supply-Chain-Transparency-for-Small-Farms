<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Customer | Supply Chain Transparency</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <style>
        .feedback-form {
            max-width: 600px;
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }
        .rating {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            direction: rtl; /* reverse order so CSS ~ selector works nicely */
            justify-content: flex-end;
        }
        .rating input[type="radio"] {
            display: none;
        }
        .rating label {
            cursor: pointer;
            font-size: 2.2rem;
            color: #D1D5DB;
            transition: color 0.15s ease;
        }
        .rating label:hover,
        .rating label:hover ~ label,
        .rating input[type="radio"]:checked ~ label {
            color: #F59E0B;
        }
    </style>
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>
                <a href="#" style="color: white;">
                    <i data-lucide="shopping-bag"></i>
                    <span>Customer Portal</span>
                </a>
            </h1>
            <div class="user-info">
                <span id="userName">Loading...</span>
                <button id="logoutBtn" class="btn btn-logout">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h3>Customer Menu</h3>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
                <li><a href="products.html"><i data-lucide="shopping-bag"></i> Browse Products</a></li>
                <li><a href="cart.html"><i data-lucide="shopping-cart"></i> My Cart</a></li>
                <li><a href="orders.html"><i data-lucide="package"></i> My Orders</a></li>
                <li><a href="feedback.html" class="active"><i data-lucide="star"></i> Feedback</a></li>
            </ul>

            <h3 style="margin-top: 1.5rem;">Navigation</h3>
            <ul class="nav-links">
                <li><a href="../sitemap.html"><i data-lucide="map"></i> Site Map</a></li>
                <li><a href="../user-manual.html"><i data-lucide="book-open"></i> User Manual</a></li>
                <li><a href="../index.html"><i data-lucide="globe"></i> Home</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2>Submit Order Feedback</h2>
            
            <div id="feedbackContainer" class="feedback-form">
                <div id="feedbackMessage" style="color: var(--text-muted);">Please select a delivered order from your Orders page to submit feedback.</div>
                
                <form id="feedbackForm" style="display: none;">
                    <input type="hidden" id="orderId">
                    <div style="margin-bottom: 1.5rem; padding: 1rem; background: var(--bg-color); border-radius: var(--radius-sm); border: 1px solid var(--border-color);">
                        <div><strong>Order Reference:</strong> <span id="displayOrderId" style="font-family: monospace;"></span></div>
                        <div style="margin-top: 0.35rem;"><strong>Producer/Farmer:</strong> <span id="displayFarmer"></span></div>
                    </div>
                    
                    <div class="form-group">
                        <label>Your Rating (1 to 5 Stars)</label>
                        <div class="rating">
                            <input type="radio" id="star5" name="rating" value="5" required>
                            <label for="star5" title="5 stars">★</label>
                            
                            <input type="radio" id="star4" name="rating" value="4">
                            <label for="star4" title="4 stars">★</label>
                            
                            <input type="radio" id="star3" name="rating" value="3">
                            <label for="star3" title="3 stars">★</label>
                            
                            <input type="radio" id="star2" name="rating" value="2">
                            <label for="star2" title="2 stars">★</label>
                            
                            <input type="radio" id="star1" name="rating" value="1">
                            <label for="star1" title="1 star">★</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="comment">Your Feedback & Comments</label>
                        <textarea id="comment" rows="4" required placeholder="Describe produce freshness, delivery timeliness, and overall satisfaction..."></textarea>
                    </div>
                    <button type="submit" class="btn">
                        <i data-lucide="send"></i>
                        <span>Submit Feedback</span>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/lucide.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
    <script type="module">
        import { checkRoleAccess, logoutUser, getCurrentUserData } from '../js/auth.js';
        import { initFeedbackPage } from '../js/customer.js';
        
        checkRoleAccess('customer');
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        
        getCurrentUserData((user) => {
            if(user) {
                document.getElementById('userName').textContent = user.name;
                initFeedbackPage(user);
                if (window.lucide) lucide.createIcons();
            }
        });
    </script>
</body>
</html>
