<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Products - Customer | Supply Chain Transparency</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>
                <a href="#" style="color: white;">
                    <i data-lucide="shopping-bag"></i>
                    <span>Customer Portal</span>
                </a>
            </h1>
            <div class="user-info">
                <a href="cart.html" style="text-decoration: none;">
                    <span id="cartCount" class="badge" style="background-color: white; color: var(--primary-color); cursor: pointer;">
                        <i data-lucide="shopping-cart"></i> 0 items
                    </span>
                </a>
                <span id="userName">Loading...</span>
                <button id="logoutBtn" class="btn btn-logout">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h3>Customer Menu</h3>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
                <li><a href="products.html" class="active"><i data-lucide="shopping-bag"></i> Browse Products</a></li>
                <li><a href="cart.html"><i data-lucide="shopping-cart"></i> My Cart</a></li>
                <li><a href="orders.html"><i data-lucide="package"></i> My Orders</a></li>
                <li><a href="feedback.html"><i data-lucide="star"></i> Feedback</a></li>
            </ul>

            <h3 style="margin-top: 1.5rem;">Navigation</h3>
            <ul class="nav-links">
                <li><a href="../sitemap.html"><i data-lucide="map"></i> Site Map</a></li>
                <li><a href="../user-manual.html"><i data-lucide="book-open"></i> User Manual</a></li>
                <li><a href="../index.html"><i data-lucide="globe"></i> Home</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;">
                <h2>Available Farm Produce</h2>
                <a href="cart.html" class="btn btn-secondary btn-sm">
                    <i data-lucide="shopping-cart"></i>
                    <span>View Cart</span>
                </a>
            </div>
            
            <div class="product-grid" id="productGrid">
                <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">Loading available products...</div>
            </div>
        </main>
    </div>

    <script src="../js/lucide.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
    <script type="module">
        import { checkRoleAccess, logoutUser, getCurrentUserData } from '../js/auth.js';
        import { initCustomerProductsPage } from '../js/customer.js';
        
        checkRoleAccess('customer');
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        
        getCurrentUserData((user) => {
            if(user) {
                document.getElementById('userName').textContent = user.name;
                initCustomerProductsPage(user);
                if (window.lucide) lucide.createIcons();
            }
        });
    </script>
</body>
</html>
