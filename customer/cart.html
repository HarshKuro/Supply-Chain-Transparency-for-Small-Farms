<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Customer | Supply Chain Transparency</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1>
                <a href="#" style="color: white;">
                    <i data-lucide="shopping-bag"></i>
                    <span>Customer Portal</span>
                </a>
            </h1>
            <div class="user-info">
                <span id="userName">Loading...</span>
                <button id="logoutBtn" class="btn btn-logout">
                    <i data-lucide="log-out"></i>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <h3>Customer Menu</h3>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i data-lucide="layout-dashboard"></i> Dashboard</a></li>
                <li><a href="products.html"><i data-lucide="shopping-bag"></i> Browse Products</a></li>
                <li><a href="cart.html" class="active"><i data-lucide="shopping-cart"></i> My Cart</a></li>
                <li><a href="orders.html"><i data-lucide="package"></i> My Orders</a></li>
                <li><a href="feedback.html"><i data-lucide="star"></i> Feedback</a></li>
            </ul>

            <h3 style="margin-top: 1.5rem;">Navigation</h3>
            <ul class="nav-links">
                <li><a href="../sitemap.html"><i data-lucide="map"></i> Site Map</a></li>
                <li><a href="../user-manual.html"><i data-lucide="book-open"></i> User Manual</a></li>
                <li><a href="../index.html"><i data-lucide="globe"></i> Home</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2>Shopping Cart</h2>
            
            <div class="table-container" style="margin-bottom: 2rem;">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Farmer</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <!-- Cart items will go here -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="4" style="text-align: right; font-size: 1.1rem; color: var(--text-color);">Total Amount:</th>
                            <th colspan="2" id="cartTotal" style="font-size: 1.25rem; font-weight: 700; color: var(--primary-color);">$0.00</th>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                <a href="products.html" class="btn btn-secondary">
                    <i data-lucide="arrow-left"></i>
                    <span>Continue Shopping</span>
                </a>
                <button id="placeOrderBtn" class="btn" style="font-size: 1.05rem; padding: 0.75rem 2rem; display: none;">
                    <i data-lucide="check"></i>
                    <span>Place Order</span>
                </button>
            </div>
        </main>
    </div>

    <script src="../js/lucide.min.js"></script>
    <script>
        if (window.lucide) lucide.createIcons();
    </script>
    <script type="module">
        import { checkRoleAccess, logoutUser, getCurrentUserData } from '../js/auth.js';
        import { initCartPage } from '../js/customer.js';
        
        checkRoleAccess('customer');
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        
        getCurrentUserData((user) => {
            if(user) {
                document.getElementById('userName').textContent = user.name;
                initCartPage(user);
                if (window.lucide) lucide.createIcons();
            }
        });
    </script>
</body>
</html>
