<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cart - Customer</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <header>
        <div class="container" style="display: flex; justify-content: space-between; align-items: center;">
            <h1><a href="#" style="color: white;">Customer Portal</a></h1>
            <div class="user-info">
                <span id="userName">Loading...</span>
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <div class="dashboard-container">
        <aside class="sidebar">
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="products.html">Browse Products</a></li>
                <li><a href="cart.html" class="active">My Cart</a></li>
                <li><a href="orders.html">My Orders</a></li>
                <li><a href="feedback.html">Feedback</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <h2>My Cart</h2>
            
            <div class="table-container" style="margin-bottom: 2rem;">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Farmer</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody">
                        <!-- Cart items will go here -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="4" style="text-align: right; font-size: 1.2rem;">Total:</th>
                            <th colspan="2" id="cartTotal" style="font-size: 1.2rem; color: var(--primary-color);">₹0.00</th>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div style="text-align: right;">
                <button id="placeOrderBtn" class="btn" style="font-size: 1.2rem; padding: 0.75rem 2rem; display: none;">Place Order</button>
            </div>
        </main>
    </div>

    <!-- Order Place Confirmation Modal (if needed) -->
    
    <script type="module">
        import { checkRoleAccess, logoutUser, getCurrentUserData } from '../js/auth.js';
        import { initCartPage } from '../js/customer.js';
        
        checkRoleAccess('customer');
        
        document.getElementById('logoutBtn').addEventListener('click', logoutUser);
        
        getCurrentUserData((user) => {
            if(user) {
                document.getElementById('userName').textContent = user.name;
                initCartPage(user);
            }
        });
    </script>
</body>
</html>
